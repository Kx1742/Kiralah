services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: splitlah
      POSTGRES_PASSWORD: splitlah
      POSTGRES_DB: splitlah
    ports:
      - "5432:5432"
    volumes:
      - splitlah-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitlah"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  splitlah-db:
