<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e5a4a" />
    <title>SplitLah: offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #f8f1e3;
        color: #2b1d14;
        font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      header {
        height: 64px;
        background:
          repeating-linear-gradient(90deg, #b3301c 0 28px, #f8f1e3 28px 56px)
            top / 100% 36px no-repeat,
          #0e5a4a;
      }
      main {
        flex: 1;
        max-width: 28rem;
        margin: 0 auto;
        padding: 32px 16px;
      }
      section {
        background: #fffdf8;
        border-radius: 28px;
        padding: 24px;
        box-shadow: 0 5px 0 rgb(43 29 20 / 0.2);
      }
      h1 {
        color: #0e5a4a;
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 16px;
        font-size: 1.125rem;
        line-height: 1.5;
      }
      button {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 999px;
        background: #b3301c;
        color: #fff;
        font:
          800 1.125rem system-ui,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #17130f;
          color: #f4ead9;
        }
        section {
          background: #241d17;
        }
        h1 {
          color: #8fd8c0;
        }
      }
    </style>
  </head>
  <body>
    <header></header>
    <main>
      <section>
        <h1>You're offline</h1>
        <p>
          Your work is saved on this phone. Try again when you have a
          connection.
        </p>
        <p lang="ms">
          Anda di luar talian. Kerja anda disimpan di telefon ini.
        </p>
        <p lang="zh-CN">你目前处于离线状态。你的内容已保存在这部手机上。</p>
        <button type="button" onclick="location.reload()">
          Try again · Cuba lagi · 再试一次
        </button>
      </section>
    </main>
  </body>
</html>
